# Conda environment for the ProWis server.
#   conda env create -f environment.yml
#   conda activate prowis
name: prowis
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - netcdf4
  - scikit-learn
  - wrf-python
  - flask
  - flask-cors
  - flask-socketio
  - termcolor
  - pymonetdb
  - pip:
      # Airflow 2.x is required (the server uses airflow.api.client.local_client,
      # removed in Airflow 3); its constraints file pins compatible versions.
      - --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.10.txt
      - apache-airflow==2.10.5
      # wsproto>=1.3 needs h11>=0.16, which conflicts with Airflow's h11 pin.
      - wsproto==1.2.0
